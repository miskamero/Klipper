[package]
name = "klipper"
version = "0.1.0"
description = "Offline gameplay recording workspace"
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.85"

[lib]
name = "klipper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "time", "io-util", "fs", "sync", "rt", "macros"] }

[dev-dependencies]
tempfile = "3"
